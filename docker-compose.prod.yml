# Producción en un servidor con Docker (VPS): tienda + PostgreSQL + tareas + Caddy (HTTPS automático).
# Variables en .env.production (copiar de .env.production.example). Uso: docs/DESPLIEGUE.md §6.
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
x-app: &app
  build:
    context: .
    args:
      APP_URL: ${APP_URL}
  image: tienda-app
  restart: unless-stopped
  env_file: .env.production
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tienda}
    UPLOAD_DIR: /data/uploads
  volumes:
    - uploads:/data/uploads
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tienda}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin "ports": la base solo es accesible dentro del servidor (red interna de Docker).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-tienda}"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    <<: *app
    # Sana = migraciones aplicadas y servidor respondiendo (la imagen no trae curl: se usa fetch de Node).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/robots.txt').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  # Vencimiento de pedidos, reconciliación de pagos y envío de correos, cada minuto.
  jobs:
    <<: *app
    command: ["sh", "-c", "while true; do npm run --silent jobs; sleep 60; done"]
    # Después de que la app aplicó las migraciones.
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
