# Lo mismo que se exige antes de cada PR (CLAUDE.md): typecheck, tests contra PostgreSQL real y build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tienda
          POSTGRES_PASSWORD: tienda
          POSTGRES_DB: tienda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tienda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciales de prueba del contenedor de CI, no secretos.
      DATABASE_URL: postgres://tienda:tienda@localhost:5432/tienda_test
      DATABASE_URL_TEST: postgres://tienda:tienda@localhost:5432/tienda_test
      # Ambiente explícito: la build corre con NODE_ENV=production y sin esto exigiría APP_URL https.
      APP_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
